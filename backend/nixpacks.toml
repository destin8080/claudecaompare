# ---------------------------------------------------------------------------
# Nixpacks build config for Railway (and any Nixpacks-based platform).
#
# Phases:
#   setup   — provision the runtime (Python 3.11)
#   install — pip-install our requirements
#   build   — download Playwright's Chromium + its system-level dependencies
#   start   — boot the FastAPI app on the platform-supplied $PORT
# ---------------------------------------------------------------------------

providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

[phases.build]
cmds = [
  ". /opt/venv/bin/activate && playwright install-deps chromium",
  ". /opt/venv/bin/activate && playwright install chromium",
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
