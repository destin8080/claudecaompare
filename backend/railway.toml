# Tell Railway to build this service from the Dockerfile in this directory
# instead of auto-detecting a Nixpacks build.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Start command lives in the Dockerfile's CMD — keeping it out of railway.toml
# avoids the "Invalid value for '--port': '$PORT'" failure (TOML doesn't expand
# shell variables; the Dockerfile's `sh -c` form does).
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
